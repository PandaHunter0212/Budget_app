<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Manager - Loading</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .loading-container {
      text-align: center;
      color: white;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 600;
    }
    
    p {
      margin: 10px 0 0 0;
      font-size: 16px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
    <h1>Finance Manager</h1>
    <p>Loading your version...</p>
  </div>

  <script>
    /**
     * Entry Point Device Detection and Redirect
     * Automatically routes users to Computer or Mobile version
     */
    
    function getDeviceType() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      
      // Check for iPhone
      const isIPhone = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
      
      // Check for other mobile devices
      const isMobile = /Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      
      return {
        isIPhone: isIPhone,
        isMobile: isMobile,
        isMobileDevice: isIPhone || isMobile
      };
    }
    
    function redirectToVersion() {
      const device = getDeviceType();
      
      if (device.isMobileDevice) {
        // Redirect to Mobile version
        window.location.href = './Mobile/';
      } else {
        // Redirect to Computer version
        window.location.href = './Computer/';
      }
    }
    
    // Redirect immediately
    redirectToVersion();
  </script>
</body>
</html>
